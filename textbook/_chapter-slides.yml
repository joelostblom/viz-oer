# Standalone project template used by src/build_chapter_slides.py.
project:
  type: default
  output-dir: _output

filters:
  - path: chapter-slide-options.lua
    at: pre-ast
  - illustrative-chart-actions.lua
  - chapter-slides.lua

resources:
  - chapter-slides.js
  - chapter-slide-tabs.js

format:
  revealjs:
    theme: default
    mainfont: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
    monofont: 'ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace'
    highlight-style: tokyo-night.theme
    code-block-bg: '#24283b'
    code-line-numbers: false
    css: chapter-slides.css
    slide-level: 2
    width: 1280
    height: 800
    margin: 0.06
    center: false
    slide-number: c/t
    transition: fade
    transition-speed: fast
    background-transition: fade
    auto-stretch: false
    overview: true
    footer: 'Press **?** for shortcuts'
    include-in-header:
      - text: |
          <script src="chapter-slides.js" defer></script>
          <script src="chapter-slide-tabs.js" defer></script>
    toc: false
    number-sections: false

execute:
  cache: false
  message: false
  warning: false
