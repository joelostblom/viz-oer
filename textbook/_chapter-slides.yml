# Standalone project template used by src/build_chapter_slides.py.
project:
  type: default
  output-dir: _output
  render:
    - 1_why-visualize-data.qmd

filters:
  - chapter-slides.lua

resources:
  - chapter-slides.js

format:
  revealjs:
    theme: default
    mainfont: Ubuntu
    css: chapter-slides.css
    slide-level: 2
    width: 1280
    height: 800
    margin: 0.06
    center: false
    slide-number: c/t
    transition: fade
    transition-speed: fast
    background-transition: fade
    auto-stretch: false
    overview: true
    include-in-header:
      - text: |
          <meta name="chapter-url" content="../1_why-visualize-data.html">
          <script src="chapter-slides.js" defer></script>
    toc: false
    number-sections: false

execute:
  cache: false
