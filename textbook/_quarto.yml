project:
  type: book
  post-render:
    - src/chapter_reference_titles.py
    - src/build_chapter_slides.py

book:
  title: "Data Visualization"
  subtitle: "Concepts & Grammars"
  date: today
  chapters:
    - index.qmd
    - 0_chapter-key.qmd
    - part: "Introduction"
      chapters:
        - 1_why-visualize-data.qmd
        - 2_grammar-of-graphics.qmd
    - part: "Foundations"
      chapters:
        - 3_individual-observations.qmd
        - 4_magnitude.qmd
        - 5_groups.qmd
        - 6_connections.qmd
    - part: "Summaries & distributions"
      chapters:
        - 7_summaries.qmd
        - 8_counts.qmd
        - 9_binned-distributions.qmd
        - 10_smoothed-distributions.qmd
        - 11_cumulative-distributions.qmd
        - 12_joint-distributions.qmd
    - part: "Communication & design"
      chapters:
        - 13_communication.qmd
        - 14_color.qmd
    - part: "Extensions & applications"
      chapters:
        - 15_uncertainty.qmd
        - 16_interactivity.qmd
        - 17_geospatial.qmd
    # - 99_misc.qmd

filters:
  - illustrative-chart-actions.lua
  - custom-callouts.lua
  - chapter-slides.lua
  - path: figure-caption-links.lua
    at: post-render

# Shared table helpers and browser behavior; utils.py also supports Python exercises.
resources:
  - utils.py
  - utils.R
  - tabset-scroll.js
  - chapter-title-tools.js
  - figure-captions.js

format:
  live-html:
    theme:
      dark:
        - darkly
        - callouts.scss
        - tokyo-night.scss
      light:
        - cosmo
        - callouts.scss
    highlight-style:
      light: arrow
      dark: tokyo-night.theme
    css: styles.css
    include-after-body:
      - text: |
          <script src="tabset-scroll.js"></script>
          <script src="chapter-title-tools.js"></script>
          <script src="figure-captions.js"></script>
    monofont: "Ubuntu Mono"
    mainfont: Ubuntu
    number-depth: 2
    fig-align: left
    fig-cap-location: margin
    tbl-cap-location: bottom

execute:
  # knitr's chunk cache does not restore reticulate's Python session state.
  # Re-run imports and dependent chunks together to avoid intermittent NameErrors.
  cache: false
