project:
  type: book

book:
  title: "Data Visualization"
  # author: "Norah Jones"
  date: today
  chapters:
    - index.qmd
    - 0_chapter-key.qmd
    - 1_why-visualize-data.qmd
    - 2_grammar-of-graphics.qmd
    - 3_individual-observations.qmd
    - 4_magnitude.qmd
    - 5_groups.qmd
    - 6_order.qmd
    - 7_summaries.qmd
    - 8_counts.qmd
    - 9_distributions.qmd
    - 10_multiple-distributions.qmd
    - 11_trends.qmd
    - 99_misc.qmd

filters:
  - custom-callouts.lua

# Shared table helpers; utils.py is also used by browser Python exercises.
resources:
  - utils.py
  - utils.R

format:
  live-html:
    theme:
      - cosmo
      - callouts.scss
    css: styles.css
    monofont: "Ubuntu Mono"
    mainfont: Ubuntu
    number-depth: 2
    tbl-cap-location: bottom

execute:
  # knitr's chunk cache does not restore reticulate's Python session state.
  # Re-run imports and dependent chunks together to avoid intermittent NameErrors.
  cache: false
