name: "Render and Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      URL: ${{ secrets.OPENAI_PROXY_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-book

      - name: Build the website
        shell: bash
        run: |
          . .uvr/activate
          uv run --locked quarto render textbook
      
      # Push the website to the gh-pages branch 
      - name: Publish the book and slides to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./textbook/_book
          keep_files: true
          destination_dir: .
