name: "Render and Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      URL: ${{ secrets.OPENAI_PROXY_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-book

      - name: Build the website
        shell: bash
        run: |
          . .uvr/activate
          uv run --locked quarto render textbook
      
      # Push the website to the gh-pages branch 
      - name: Publish the book and slides to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: textbook/_book
          clean: true
          # Preserve complete PR snapshots while removing obsolete production files.
          clean-exclude: |
            /pull[0-9]*/***
            /diff[0-9]*/***
          # Rebase concurrent deployments instead of overwriting preview updates.
          force: false
