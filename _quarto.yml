project:
  type: book
  execute-dir: project
  post-render:
    - src/chapter_reference_titles.py
    - src/build_chapter_slides.py

book:
  title: "Data Visualization"
  subtitle: "Concepts & Grammars"
  date: today
  chapters:
    - index.qmd
    - chapters/chapter-key.qmd
    - part: "Introduction"
      chapters:
        - chapters/why-visualize-data.qmd
        - chapters/grammar-of-graphics.qmd
    - part: "Foundations"
      chapters:
        - chapters/observations.qmd
        - chapters/magnitude.qmd
        - chapters/groups.qmd
        - chapters/connections.qmd
    - part: "Distributions"
      chapters:
        - chapters/categorical.qmd
        - chapters/binned.qmd
        - chapters/smoothed.qmd
        - chapters/cumulative.qmd
        - chapters/joint.qmd
    - part: "Summaries"
      chapters:
        - chapters/center-and-spread.qmd
        - chapters/trends.qmd
        - chapters/uncertainty.qmd
    - part: "Presentation"
      chapters:
        - chapters/communication.qmd
        - chapters/color.qmd
        - chapters/composition.qmd
    - part: "Exploration"
      chapters:
        - chapters/eda.qmd
        - chapters/interactivity.qmd
    - part: "Applications"
      chapters:
        - chapters/geospatial.qmd
    # - chapters/misc.qmd

filters:
  - path: src/filters/chapter-slide-options.lua
    at: pre-ast
  - src/filters/illustrative-chart-actions.lua
  - src/filters/custom-callouts.lua
  - src/filters/chapter-slides.lua
  - path: src/filters/figure-caption-links.lua
    at: post-render

# Shared table helpers and browser behavior; utils.py also supports Python exercises.
resources:
  - src/utils.py
  - src/utils.R
  - assets/scripts/tabset-scroll.js
  - assets/scripts/chapter-title-tools.js
  - assets/scripts/figure-captions.js

format:
  live-html:
    theme:
      dark:
        - darkly
        - assets/styles/callouts.scss
        - assets/styles/tokyo-night.scss
      light:
        - cosmo
        - assets/styles/callouts.scss
    highlight-style:
      light: arrow
      dark: assets/styles/tokyo-night.theme
    css: assets/styles/styles.css
    include-after-body:
      - text: |
          <script src="/assets/scripts/tabset-scroll.js"></script>
          <script src="/assets/scripts/chapter-title-tools.js"></script>
          <script src="/assets/scripts/figure-captions.js"></script>
    monofont: "Ubuntu Mono"
    mainfont: Ubuntu
    number-depth: 2
    fig-align: left
    fig-cap-location: margin
    tbl-cap-location: bottom

execute:
  # knitr's chunk cache does not restore reticulate's Python session state.
  # Re-run imports and dependent chunks together to avoid intermittent NameErrors.
  cache: false
